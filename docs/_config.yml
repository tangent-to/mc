# Site settings
title: "tangent/mc"
tagline: "Bayesian inference toolkit for JavaScript"
description: "PyMC-inspired Markov Chain Monte Carlo for JavaScript/TypeScript. Define probabilistic models, draw posterior samples, and check convergence."
version: "0.4.1"
url: "https://tangent-to.github.io"
baseurl: "/mc"

# Repository
repository: tangent-to/mc

# Theme: same remote theme + custom teal accent as tangent/ds (the previous
# jekyll-theme-cayman did not match the just-the-docs layouts/classes the pages use).
remote_theme: just-the-docs/just-the-docs
color_scheme: teal

# Logo (path is relative to baseurl; just-the-docs prepends baseurl itself)
logo: "/assets/images/logo.png"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Heading anchor links
heading_anchors: true

# Aux links (top right)
aux_links:
  "View on GitHub":
    - "https://github.com/tangent-to/mc"
  "NPM Package":
    - "https://www.npmjs.com/package/@tangent.to/mc"

# Footer
footer_content: 'Copyright &copy; 2025 Tangent. Distributed under the <a href="https://github.com/tangent-to/mc/blob/main/LICENSE">Apache-2.0 License</a>.'

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Build settings (MathJax for the model / distribution equations)
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-sitemap

# Exclude from processing
exclude:
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - api-generated/
  - CONSIDERATIONS.md
  - OBSERVABLE.md
  - PLATFORMS.md
