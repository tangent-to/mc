name: Deploy Site

# Manual only: run from the Actions tab ("Run workflow"). Generates the API
# reference from JSDoc (TypeDoc), then publishes docs/ to the gh-pages branch
# (the configured Pages source), where GitHub Pages builds the Jekyll site.
on:
  workflow_dispatch:

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate API reference from JSDoc (TypeDoc)
        run: npm run docs:api

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          enable_jekyll: true
