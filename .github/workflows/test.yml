name: Test

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

# mc depends on @tangent.to/proba via a file:../ specifier, so CI checks out
# and builds the proba sibling repo next to it before installing.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
        with:
          path: mc
      - uses: actions/checkout@v4
        with: { repository: tangent-to/proba, path: proba }

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build proba (produces its dist for the file dependency)
        run: npm install --no-fund --no-audit
        working-directory: proba

      - name: Install dependencies
        run: npm install --no-fund --no-audit
        working-directory: mc

      - name: Run tests
        run: npm run test:run
        working-directory: mc

      - name: Build browser bundle
        run: npm run build:browser
        working-directory: mc

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check package name
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if [ "$PACKAGE_NAME" != "@tangent.to/mc" ]; then
            echo "Error: Package name should be @tangent.to/mc"
            exit 1
          fi
          echo "Package name is correct: $PACKAGE_NAME"

      - name: Verify required files
        run: |
          REQUIRED_FILES=(
            "README.md"
            "LICENSE"
            "package.json"
            "src/index.js"
            "docs/PLATFORMS.md"
            "docs/OBSERVABLE.md"
          )

          MISSING_FILES=()
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_FILES+=("$file")
            fi
          done

          if [ ${#MISSING_FILES[@]} -ne 0 ]; then
            echo "Error: Missing required files:"
            printf '%s\n' "${MISSING_FILES[@]}"
            exit 1
          fi

          echo "All required files present"
