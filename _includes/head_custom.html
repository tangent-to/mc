<!-- Custom head content for tangent/mc documentation -->
<link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/logo.png">

<!-- Open Graph / social meta -->
<meta property="og:title" content="{{ page.title | default: site.title }} - {{ site.tagline }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.baseurl }}/assets/images/logo.png">
<meta name="twitter:card" content="summary">

<!-- Inter font (matches tangent/ds) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- MathJax for the model / distribution equations -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  code { background-color: #f6f8fa; padding: 0.2em 0.4em; border-radius: 4px; }
</style>
